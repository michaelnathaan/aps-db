version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Files run in alphabetical order
      - ./migrations/001_create_users_table.sql:/docker-entrypoint-initdb.d/001_create_users_table.sql:ro
      - ./migrations/002_create_facilities_table.sql:/docker-entrypoint-initdb.d/002_create_facilities_table.sql:ro
      - ./migrations/003_create_bookings_table.sql:/docker-entrypoint-initdb.d/003_create_bookings_table.sql:ro
      - ./migrations/004_create_indexes.sql:/docker-entrypoint-initdb.d/004_create_indexes.sql:ro
      # Uncomment after first successful migration to seed data
      # - ./seeds/001_users.sql:/docker-entrypoint-initdb.d/005_seed_users.sql:ro
      # - ./seeds/002_facilities.sql:/docker-entrypoint-initdb.d/006_seed_facilities.sql:ro
      # - ./seeds/003_bookings.sql:/docker-entrypoint-initdb.d/007_seed_bookings.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aps-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aps-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aps-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aps-network:
    driver: bridge