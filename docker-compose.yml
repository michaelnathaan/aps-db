version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apsadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apspassword123}
      POSTGRES_DB: ${POSTGRES_DB:-apartment_booking}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-run migrations on startup
      # - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
      # Optional: seed data (comment out after first run)
      # - ./seeds:/docker-entrypoint-initdb.d/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apsadmin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aps-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aps-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aps.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - aps-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  aps-network:
    driver: bridge